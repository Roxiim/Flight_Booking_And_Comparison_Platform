spring.application.name=flight-booking-platform-test

# Isolated, in-memory database for tests only.
spring.datasource.url=jdbc:h2:mem:flight_booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Build and discard the test schema on each test run. Production remains on validate.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
